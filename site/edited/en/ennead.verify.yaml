slug: ennead
findings:
  - kind: unsupported
    quote: Nine gods in four generations, all of them descended from one.
    why: The source never counts generations, and its genealogy makes Atum a
      member of the nine rather than an ancestor outside them (the Mythology
      section calls him self-begotten), so the nine are not all descended from
      one — eight of them are. The count is derivable from the source's list,
      but the framing is not something the source states.
    severity: minor
verdict: minor-only

slug: koine-greek
findings:
  - kind: unsupported
    quote: Where it came from was argued over for much longer.
    why: The source says only that "The linguistic roots of the Common Greek
      dialect had been unclear since ancient times". It makes no comparison
      between how long the origin question was argued over and how long the
      end-of-period question was; the comparative "for much longer" is the
      rewrite's own addition.
    severity: minor
  - kind: unsupported
    quote: υ/οι unround to merge with ι – the last of the changes known as iotacism.
    why: The source says "η ... was raised and merged with ι. In the 10th century
      AD, υ/οι unrounded to merge with ι. These changes are known as
      iotacism." It does not say the 10th-century change was the last of them,
      nor that iotacism consists only of those changes.
    severity: minor
verdict: minor-only

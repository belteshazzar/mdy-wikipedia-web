slug: thoth
findings:
  - kind: dropped-hedge
    quote: Egyptian scribes worshipped him universally and kept his picture in
      their offices; the Greeks related him to their own Hermes.
    why: "The source qualifies the picture claim: \"Many scribes had a painting or
      a picture of Thoth in their 'office'.\" Only the worship is described as
      universal; the standfirst carries \"universally\" across into a flat
      claim that Egyptian scribes kept his picture in their offices."
    severity: minor
verdict: minor-only

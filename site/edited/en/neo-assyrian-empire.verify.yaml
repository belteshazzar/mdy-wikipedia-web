slug: neo-assyrian-empire
findings:
  - kind: unsupported
    quote: The commander-in-chief, the highest of the seven great offices; four of
      those offices, this one included, also carried the governorship of an
      important province.
    why: The source never ranks the seven magnate offices against each other. It
      says only that the "magnates" are "a grouping by modern historians for
      the seven highest-ranking officials in the administration" and lists
      them (masennu, nagir ekalli, rab saqe, rab sa-resi, sartinnu, sukkallu,
      turtanu) with turtanu last, in what appears to be alphabetical rather
      than rank order. Nothing in the source makes the turtanu the highest of
      the seven. The rest of the gloss (commander-in-chief; four offices
      including the turtanu carried governorships) is supported.
    severity: blocking
verdict: blocked

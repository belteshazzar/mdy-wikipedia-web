slug: history-of-the-assyrians
findings:
  - kind: dropped-hedge
    quote: For purposes of [[ historiography ]], modern researchers divide ancient
      Assyrian history, based on political events and gradual changes in
      language, into the [[ Early Assyrian | early-assyrian-period ]] (c.
      2600–2025 BC), [[ Old Assyrian | old-assyrian-period ]] (c. 2025–1364
      BC), [[ Middle Assyrian | middle-assyrian-empire ]] (c. 1363–912 BC), [[
      Neo-Assyrian | neo-assyrian-empire ]] (911–609 BC) and [[ post-imperial
      | post-imperial-assyria ]] (609 BC–c. AD 240) periods,[[ ^10 ]][[ ^11 ]]
      followed by Sassanid era [[ Asoristan ]] from 240 AD until 637 AD and
      the post Islamic Conquest period until the present day.
    why: 'The source hedges the periodisation: "ancient Assyrian history is often
      divided by modern researchers". The rewrite drops "often", stating the
      division as what modern researchers simply do.'
    severity: minor
verdict: minor-only

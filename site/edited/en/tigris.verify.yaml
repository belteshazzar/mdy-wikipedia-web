slug: tigris
findings:
  - kind: dropped-hedge
    quote: Sumerian scribes called it "the swift river" to set it against the
      Euphrates next door, whose leisurely pace left it dropping silt until it
      had built its bed up higher than its neighbour's.
    why: "The source hedges the meaning: \"The Sumerian term, which can be
      interpreted as 'the swift river', contrasts the Tigris to its neighbour,
      the Euphrates\". It offers a modern interpretation of the term, and says
      nothing about what Sumerian scribes called the river."
    severity: minor
  - kind: unsupported
    quote: It has been named in a dozen languages, worshipped as a god, dammed,
      and used as a weapon.
    why: The source says only that "Water from both rivers is used as a means of
      pressure during conflicts"; it does not say the river was used as a
      weapon.
    severity: minor
verdict: minor-only

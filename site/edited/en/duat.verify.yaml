slug: duat
findings:
  - kind: dropped-hedge
    quote: "Ancient Egypt's underworld, known only from funerary texts and never
      depicted the same way twice: a dark country of gates, rivers and lakes
      of fire, where the sun god sails through the twelve hours of the night
      and the dead are weighed against a feather."
    why: The source says what is known of the Duat 'derives principally from
      funerary texts such as' the named works, 'among many other sources'.
      'Only from funerary texts' drops 'principally' and contradicts 'among
      many other sources' — the rewrite's own prose still carries both
      qualifiers.
    severity: blocking
  - kind: dropped-hedge
    quote: The conceptions of the //Duat// found in that text are therefore the
      most commonly referenced [[ canon | canon-fiction ]] when discussing [[
      ancient Egyptian afterlife beliefs ]].
    why: The source says they 'are considered to be the most commonly referenced
      canon'; the rewrite states it flat.
    severity: minor
  - kind: unsupported
    quote: The realm is divided by [[ twelve guarded gates |
      gate-deities-of-the-underworld ]], one for each hour of the night,
      closely associated with Ra's journey, and the sections they mark
      prominently feature [[ Osiris ]], god of the //Duat// and
      personification of rebirth.
    why: In the source it is the twelve gates that 'represent each hour of the
      night and are closely associated with the journey of Ra and prominently
      feature Osiris'. The source does not say the sections feature Osiris.
    severity: minor
verdict: blocked

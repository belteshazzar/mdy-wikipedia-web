slug: ptolemaic-synodal-decrees
findings:
  - kind: unsupported
    quote: Nine of the decrees are known, from 243 BC to 161 BC, and one of the
      stones cut with them is the Rosetta Stone.
    why: The source never counts the decrees or states a total. Its lead names
      only the decrees of Ptolemy III, IV and V and then says 'and others';
      the figure nine is the rewriter's own tally of the article's section
      headings, and the source nowhere asserts that this is the full set of
      known decrees. (The date range 243 BC to 161 BC and the Rosetta Stone
      are supported.) The same count is repeated in the standfirst and in the
      'When' key fact.
    severity: minor
  - kind: unsupported
    quote: "In each of these decrees a synod of Egyptian priests set down what
      their Greek king had done for the temples, and voted him honours in
      return: statues, shrines, worship as a god."
    why: The source says only that in each decree 'religious honours are decreed
      for him'. The specific honours — statues, a shrine, worship as
      beneficent gods — are attested in the source solely for the 243 BC
      Decree of Alexandria, not for every decree.
    severity: minor
verdict: minor-only

slug: ptolemaic-synodal-decrees
findings:
  - kind: unsupported
    quote: The decree of Ptolemy IV Philopator is carried by three stones, two of
      them still to be seen and one known only from photographs.
    why: The source says only that the Fragment from Tod disappeared shortly after
      discovery and was published on photographic evidence alone. It says
      nothing about the present whereabouts or survival of the Stele of
      Memphis and the Pithom Stele; "still to be seen" is a claim about their
      current state that the source does not make.
    severity: blocking
  - kind: unsupported
    quote: "In each of these decrees a synod of Egyptian priests set down what
      their Greek king had done for the temples, and voted him honours in
      return: statues, shrines, worship as a god."
    why: The source says only that in each decree "religious honours are decreed
      for him". Statues, a shrine and worship as beneficent gods are what the
      source attributes specifically to the 243 BC Decree of Alexandria, not
      to every decree.
    severity: minor
  - kind: unsupported
    quote: The nine known decrees run from 243 BC to 161 BC
    why: The source gives no total. It describes "a series of decrees" and its
      lead enumerates only six (two under Ptolemy III, one under Ptolemy IV,
      three under Ptolemy V); the figure nine is obtained by counting the
      article's section headings, and the source never states that nine is the
      number known.
    severity: minor
verdict: blocked

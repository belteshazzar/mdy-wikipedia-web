slug: nun-mythology
findings:
  - kind: unsupported
    quote: The ancient Egyptians envisaged the oceanic abyss of the Nun as
      surrounding a bubble in which the sphere of life is encapsulated, and
      called this the deepest mystery of their cosmogony.
    why: The source describes the abyss as "representing the deepest mystery of
      their cosmogony" in the article's own voice. It does not say the ancient
      Egyptians called it that; the rewrite turns the article's
      characterisation into a statement about what the Egyptians themselves
      said.
    severity: minor
  - kind: unsupported
    quote: One of the eight deities of the Ogdoad, he had no temple and no cult,
      yet was painted on temple walls for the rest of Egyptian religious
      history.
    why: The source says Nun "is depicted on temple walls", not painted, and dates
      this only "Beginning with the Middle Kingdom" — a starting point the
      standfirst drops, so "for the rest of Egyptian religious history" is
      left without its anchor.
    severity: minor
  - kind: dropped-hedge
    quote: the god who will one day destroy existence and take everything back
      into it
    why: 'The source hedges this: "Nun is also considered the god that will
      destroy existence and return everything to the Nun whence it came." The
      hook states it flat, and "one day" adds a temporal framing the source
      does not give.'
    severity: minor
  - kind: unsupported
    quote: The boat carrying the sun, which Nun is typically shown holding aloft
      with upraised arms.
    why: 'The source makes these two separate statements: Nun is "typically
      depicted in ancient Egyptian art holding aloft the solar barque or the
      sun disc", while "upraised arms" belongs specifically to the 12th Hour
      of the Book of Gates. The source does not say the upraised-arms pose is
      the typical depiction.'
    severity: minor
verdict: minor-only

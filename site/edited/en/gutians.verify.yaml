slug: gutians
findings:
  - kind: dropped-hedge
    quote: The floruit of Lugal-Anne-Mundu of Adab, whose inscriptions — known
      from copies of c. 17th century BC — list the Guti among the nations
      paying his empire tribute.
    why: "The source hedges the attribution twice and then discredits the text:
      the Guti appear in texts of c. 17th century BC that are \"purported
      copies of inscriptions proposed to be of Lugal-Anne-Mundu\", and it adds
      that this \"fragmentary text has been described as a
      'pseudoautobiographical literary composition'\". The timeline entry
      states as fact that these are his inscriptions, which the source never
      asserts. (The rewrite's prose keeps the hedge; this field does not.)"
    severity: blocking
  - kind: dropped-hedge
    quote: The Gutians briefly overrun Elam towards the close of
      Kutik-Inshushinak's reign.
    why: The source says "The Gutians seem also to have briefly overrun Elam at
      around the same time". The timeline entry states it flat and also drops
      "at around the same time" in favour of a firm c. 2100 BCE.
    severity: minor
  - kind: unsupported
    quote: No artifact has been positively identified as Gutian, and their
      language survives only in the names of their kings.
    why: The source says the Gutian language "lacks a text corpus, apart from some
      proper names" — proper names generally, not specifically or exclusively
      royal names. It separately notes that the names of Gutian kings suggest
      the language was unrelated to its neighbours, but it never says kings'
      names are all that survives. The prose repeats the narrowing as "What
      survives is a handful of royal names", which also puts a count ("a
      handful") on the source's unquantified "some".
    severity: minor
  - kind: unsupported
    quote: An inscription dated c. 2130 BCE records the same arrangement from the
      other side
    why: The source's caption says only that the inscription mentions the Gutians
      and dates itself by Siium's kingship of Gutium. That the Lugalanatum
      dating formula and Erridupizir's "King of Gutium, King of the Four
      Quarters" titulary attest one and the same arrangement, seen from two
      sides, is the rewrite's inference; the source draws no connection
      between them.
    severity: minor
  - kind: dropped-hedge
    quote: "Their grip was not total: autonomous rulers soon arose again in a
      number of city-states"
    why: The source says "However, it seems that autonomous rulers soon arose
      again in a number of city-states". The rewrite states it flat and adds
      the flat characterisation that Gutian control "was not total".
    severity: minor
verdict: blocked

about: >
  Build options the entry document reads. A `.yaml` file in a site directory
  has its fields merged into `meta`, so this is queryable like any other
  record — which is how a script-defined site takes a flag, since `mdy build`
  has no `--data`.

# Whether to emit /compare/<slug>/ — the imported article beside its rewrite.
#
# It is a review tool, not a reader feature, and it is expensive: each page
# renders BOTH documents, so 41 of them are 82 extra renders of the largest
# things on the site. Turn it on when reviewing rewrites, off when building
# for readers.
compare: false

# The path the site is served under, without a trailing slash. Empty means the
# root, which is what `npm run serve` gives and what a custom domain would.
#
# GitHub project Pages serve at /<repo>/, and every URL this site writes is
# absolute — `/style.css`, `/babylon/`, the search index's fetch — so a
# subpath deployment has to be built for its subpath rather than moved into
# one. `.github/workflows/pages.yml` sets this before it builds; nothing else
# writes it, so a local build stays a root build and the two never disagree.
base: ''
